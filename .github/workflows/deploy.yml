name: Deploy to VPS

# Runs on every push to master, including commits made from the /admin dashboard.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install, lint and build
        run: |
          npm ci
          npm run lint
          npm run build-prod
        env:
          # Public Web3Forms key for the contact form (repository variable, not a secret).
          VITE_WEB3FORMS_ACCESS_KEY: ${{ vars.WEB3FORMS_ACCESS_KEY }}

      - name: Upload the build to the VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: build.tar.gz
          target: ~/profile

      # nginx serves ~/profile/dist; swap it in one move so visitors never see a half-copied site.
      - name: Swap in the new build
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd ~/profile
            rm -rf release dist.old
            mkdir release
            tar zxf build.tar.gz -C release
            if [ -d dist ]; then mv dist dist.old; fi
            mv release/dist dist
            rm -rf release build.tar.gz
            echo "Deployed $(date)"
